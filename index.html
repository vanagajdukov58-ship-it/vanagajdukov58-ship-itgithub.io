<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grow A Garden</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent; /* Убирает синее выделение при тапе на смартфонах */
      outline: none !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Полный запрет прокрутки */
      position: fixed; /* Зафиксировать экран */
      background-color: #ffffff;
      font-family: Arial, sans-serif;
      touch-action: manipulation; /* Запрет двойного зума */
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 20px 30px 20px;
    }

    .game-container {
      width: 100%;
      max-width: 360px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    /* Верхняя сетка 2x2 */
    .plots-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      width: 100%;
      margin-top: 30px;
    }

    .plot-slot {
      aspect-ratio: 1 / 1;
      border: 2px solid #000000;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
    }

    /* Текст таймера */
    .timer-text {
      font-size: 3rem;
      font-weight: 500;
      color: #000000;
    }

    /* Нижняя панель с семенами */
    .inventory-bar {
      border: 1.5px solid #000000;
      padding: 4px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      width: 100%;
      background-color: #ffffff;
      margin-bottom: 20px;
    }

    .seed-slot {
      aspect-ratio: 1 / 1;
      border: 1px solid #000000;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 6px;
      transition: transform 0.1s ease;
    }

    /* Эффект нажатия на семя без синего цвета */
    .seed-slot.selected {
      transform: scale(0.92);
      background-color: #f5f5f5;
    }

    img {
      max-width: 85%;
      max-height: 85%;
      object-fit: contain;
      pointer-events: none; /* Запрещает перетаскивать картинки */
    }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- 4 верхних слота -->
    <div class="plots-grid">
      <div class="plot-slot" data-index="0"></div>
      <div class="plot-slot" data-index="1"></div>
      <div class="plot-slot" data-index="2"></div>
      <div class="plot-slot" data-index="3"></div>
    </div>

    <!-- 4 нижних слота с семенами -->
    <div class="inventory-bar">
      <div class="seed-slot"><img src="seed.png" alt="семя"></div>
      <div class="seed-slot"><img src="seed.png" alt="семя"></div>
      <div class="seed-slot"><img src="seed.png" alt="семя"></div>
      <div class="seed-slot"><img src="seed.png" alt="семя"></div>
    </div>
  </div>

  <script>
    let selectedSeed = false;
    const plotsState = [
      { status: 'empty', timer: null, count: 3 },
      { status: 'empty', timer: null, count: 3 },
      { status: 'empty', timer: null, count: 3 },
      { status: 'empty', timer: null, count: 3 }
    ];

    const seedSlots = document.querySelectorAll('.seed-slot');
    const plotSlots = document.querySelectorAll('.plot-slot');

    // Клик по слоту с семенами
    seedSlots.forEach(slot => {
      slot.addEventListener('click', () => {
        selectedSeed = true;
        seedSlots.forEach(s => s.classList.remove('selected'));
        slot.classList.add('selected');
      });
    });

    // Клик по верхним слотам
    plotSlots.forEach((slot, index) => {
      slot.addEventListener('click', () => {
        const state = plotsState[index];

        if (state.status === 'empty' && selectedSeed) {
          startGrowing(index);
          resetSeedSelection();
        } else if (state.status === 'ready') {
          harvestCarrot(index);
        }
      });
    });

    function resetSeedSelection() {
      selectedSeed = false;
      seedSlots.forEach(s => s.classList.remove('selected'));
    }

    // Запуск отсчета (3с -> 2с -> 1с -> Морковь)
    function startGrowing(index) {
      const state = plotsState[index];
      const slotElement = plotSlots[index];
      
      state.status = 'growing';
      state.count = 3;
      
      slotElement.innerHTML = `<span class="timer-text">${state.count}s</span>`;

      state.timer = setInterval(() => {
        state.count--;
        if (state.count > 0) {
          slotElement.innerHTML = `<span class="timer-text">${state.count}s</span>`;
        } else {
          clearInterval(state.timer);
          state.status = 'ready';
          slotElement.innerHTML = `<img src="carrot.png" alt="морковь">`;
        }
      }, 1000);
    }

    // Сбор моркови
    function harvestCarrot(index) {
      const state = plotsState[index];
      state.status = 'empty';
      state.count = 3;
      plotSlots[index].innerHTML = '';
    }
  </script>
</body>
</html>
